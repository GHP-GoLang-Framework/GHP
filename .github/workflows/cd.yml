name: CD

# Publica uma imagem "edge" a cada push em main que passar no CI, e cria
# automaticamente uma release CalVer (YYYY.MM.DD[.N]) logo em seguida — mesmo
# padrão do Nexo: a tag marca quando aquele build ficou disponível, criada
# depois do publish, não antes. release.yml cobre só o caso de alguém
# taguear uma CalVer manualmente (este job usa GITHUB_TOKEN, que não dispara
# outros workflows, então a criação da release acontece aqui mesmo).
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish-edge-image:
    name: Publish Edge Image
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.lowercase.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Lowercase image name
        id: lowercase
        # GHCR exige nome de imagem em minúsculas; github.repository preserva
        # o case real do repositório (ex.: GHP-GoLang-Framework/GHP).
        run: |
          IMAGE=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=$IMAGE" >> "$GITHUB_ENV"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=edge

      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ghp:scan
          labels: ${{ steps.meta.outputs.labels }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghp:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: Tag & Release
    needs: [publish-edge-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        # Checkout do branch padrão (main), não do head_sha do workflow_run:
        # este job roda com contents:write, e dar checkout do ref não-confiável
        # do evento seria um "pwn request" (Semgrep workflow-run-target-code-checkout).
        # O release é fixado no commit certo via `gh release create --target "$SHA"`
        # e via `git checkout "$SHA"` logo abaixo — um checkout local de um commit
        # já presente no histórico confiável, não um fetch de ref externo.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout do commit exato liberado
        run: git checkout "${{ github.event.workflow_run.head_sha }}"

      - name: Compute CalVer tag
        id: tag
        run: |
          # CalVer YYYY.MM.DD[.N] (UTC). Primeira release do dia sem sufixo;
          # releases seguintes no mesmo dia ganham .1, .2, ...
          TODAY=$(date -u +%Y.%m.%d)
          EXISTING=$(git tag --list "$TODAY" "$TODAY.*" | wc -l)
          if [ "$EXISTING" -eq 0 ]; then TAG="$TODAY"; else TAG="$TODAY.$EXISTING"; fi
          echo "Releasing $TAG (existentes hoje: $EXISTING)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build multi-platform binaries
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p dist
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS=${platform%/*}
            GOARCH=${platform#*/}
            ext=""
            [ "$GOOS" = "windows" ] && ext=".exe"
            name="ghp_${TAG}_${GOOS}_${GOARCH}"
            echo "Building $name"
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -trimpath -ldflags="-s -w" -o "dist/ghp${ext}" ./cmd/ghp
            if [ "$GOOS" = "windows" ]; then
              (cd dist && zip -q "${name}.zip" "ghp${ext}" && rm "ghp${ext}")
            else
              (cd dist && tar -czf "${name}.tar.gz" "ghp${ext}" && rm "ghp${ext}")
            fi
          done
          (cd dist && sha256sum * > checksums.txt)
          ls -la dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create tag, imagem versionada e GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ steps.tag.outputs.tag }}
          IMAGE: ${{ env.REGISTRY }}/${{ needs.publish-edge-image.outputs.image }}
          DIGEST: ${{ needs.publish-edge-image.outputs.digest }}
        run: |
          # Retagueia a imagem já buildada e escaneada no job anterior (por
          # digest, sem rebuild) com a versão CalVer e "latest".
          docker buildx imagetools create \
            -t "$IMAGE:$TAG" \
            -t "$IMAGE:latest" \
            "$IMAGE@$DIGEST"

          # gh cria a tag em $SHA e a release juntos, com os binários
          # multi-plataforma como assets; --generate-notes monta o corpo a
          # partir dos commits/PRs desde a release anterior.
          gh release create "$TAG" --target "$SHA" --title "$TAG" --generate-notes dist/*
